name: FIELDWORK search app tests
on:
  push:
    branches: [search-chat-mvp]
  pull_request:
    branches: [main]
    paths:
      - "fieldwork-search/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldwork-search
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: node --check backend/static/app.js
