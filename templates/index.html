<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatterless</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" class="hidden-mobile">
    <div class="sidebar-head">
      <button id="btn-new" class="btn primary wide">+ New chat</button>
      <button id="btn-import" class="btn ghost wide">Import JSON</button>
      <input type="file" id="import-file" accept="application/json" hidden>
      <div class="tabbar">
        <button class="tab active" data-filter="active">Active</button>
        <button class="tab" data-filter="archived">Archived</button>
      </div>
    </div>
    <div id="chat-list"></div>
    <div class="sidebar-foot">
      <button id="btn-export" class="btn ghost wide">Export all chats</button>
      <button id="btn-settings" class="btn ghost wide">Settings</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="btn-menu" class="btn icon" title="Menu">☰</button>
      <input id="chat-title" placeholder="Untitled chat" disabled>
      <select id="model-select"><option value="">Select model…</option></select>
      <button id="btn-share" class="btn icon" title="Share">🔗</button>
      <button id="btn-archive" class="btn icon" title="Archive">📦</button>
      <button id="btn-pin" class="btn icon" title="Pin">📌</button>
      <button id="btn-delete" class="btn icon danger" title="Delete">🗑</button>
    </header>
    <div id="messages"></div>
    <footer id="composer">
      <div id="attachments"></div>
      <div class="composer-row">
        <button id="btn-attach" class="btn icon" title="Attach file">📎</button>
        <input type="file" id="file-input" hidden>
        <textarea id="prompt" rows="1" placeholder="Message… (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="btn-send" class="btn primary icon" title="Send">➤</button>
        <button id="btn-stop" class="btn danger icon hidden" title="Stop">■</button>
      </div>
    </footer>
  </main>
</div>

<div id="settings-modal" class="modal hidden">
  <div class="modal-card">
    <h2>Settings</h2>
    <label>Theme
      <select id="set-theme"><option value="dark">Dark</option><option value="light">Light</option></select>
    </label>
    <label>Featherless API key
      <input id="set-api-key" type="password" placeholder="sk-…">
    </label>
    <div class="row">
      <button id="btn-load-models" class="btn ghost">Load models from Featherless</button>
      <button id="btn-refresh-models" class="btn ghost">↻</button>
    </div>
    <label>Custom models (one per line)
      <textarea id="set-models" rows="4" placeholder="e.g. meta-llama/Meta-Llama-3.1-8B-Instruct"></textarea>
    </label>
    <div class="row right">
      <button id="btn-settings-close" class="btn ghost">Close</button>
      <button id="btn-settings-save" class="btn primary">Save</button>
    </div>
  </div>
</div>
<div id="modal-backdrop" class="hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
