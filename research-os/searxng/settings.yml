# SearXNG for Research OS: JSON API on, SafeSearch off, onion engines through Tor.
# Engine names/options follow docs.searxng.org (Nov 2026). If an engine name changed, SearXNG logs it on startup.
use_default_settings: true
general:
  instance_name: "research-os"
server:
  secret_key: "change-me"          # overridden by SEARXNG_SECRET in docker-compose
  limiter: false                   # private instance behind the backend; no bot limiter needed
  image_proxy: false
search:
  safe_search: 0                   # no filtering
  formats: [html, json]            # the backend uses JSON
outgoing:
  request_timeout: 6.0
  max_request_timeout: 30.0
engines:
  # Onion search engines: only these go through Tor, so normal web engines stay fast.
  - name: ahmia
    disabled: false
    using_tor_proxy: true
    proxies: { all://: [socks5h://tor:9050] }
    timeout: 30.0
  - name: torch
    disabled: false
    using_tor_proxy: true
    proxies: { all://: [socks5h://tor:9050] }
    timeout: 30.0
  # Extra general engines worth having on; add or remove to taste.
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: qwant
    disabled: false
